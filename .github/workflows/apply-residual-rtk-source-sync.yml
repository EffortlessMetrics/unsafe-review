name: Apply residual RTK source sync

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'sync/remove-residual-rtk-guidance' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: sync/remove-residual-rtk-guidance
          fetch-depth: 0
      - name: Apply source-local direct command migration and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('docs/contributing/SOURCE_HISTORY_CATCHUP.md'),
              Path('docs/contributing/SWARM_MIRROR.md'),
              Path('docs/dogfood/README.md'),
              Path('docs/dogfood/index.md'),
              Path('docs/process/PR_RELEASE_DISCIPLINE.md'),
              Path('docs/releases/CRATES_IO_PATCH_RELEASE.md'),
              Path('docs/specs/UNSAFE-REVIEW-SPEC-0044-issue-linked-work-specs.md'),
              Path('docs/status/OBJECTIVE_AUDIT.md'),
              Path('plans/work-specs/UNSAFE-REVIEW-WORK-1880.toml'),
              Path('plans/work-specs/examples/UNSAFE-REVIEW-WORK-1900.toml'),
              Path('plans/work-specs/examples/UNSAFE-REVIEW-WORK-1916-FREEZE.toml'),
              Path('plans/work-specs/fixtures/invalid/scheduling-field.toml'),
              Path('xtask/src/work_specs.rs'),
          ]
          changed = []
          for path in paths:
              if not path.is_file():
                  continue
              raw = path.read_text(encoding='utf-8')
              migrated = raw.replace('rtk proxy git', 'git').replace('rtk proxy gh', 'gh').replace('rtk ', '')
              if path == Path('docs/dogfood/README.md'):
                  migrated = migrated.replace(
                      'If a dogfood run must stream `gh pr diff`, use `proxy` and feed the stream\n'
                      'directly to `unsafe-review pr --diff -`; do not save product-input patches\n'
                      'through PowerShell redirection.',
                      'If a dogfood run must stream `gh pr diff`, feed the stream directly to\n'
                      '`unsafe-review pr --diff -`; do not save product-input patches through\n'
                      'PowerShell redirection.'
                  )
              if path == Path('docs/dogfood/index.md'):
                  migrated = migrated.replace(
                      'When saving a raw diff from GitHub, use\n'
                      '`gh pr diff ...` so RTK does not compact away `diff --git` headers.',
                      'When streaming a raw diff from GitHub, pipe\n'
                      '`gh pr diff ...` directly into `unsafe-review pr --diff -` so the raw\n'
                      '`diff --git` headers are preserved.'
                  )
              if migrated != raw:
                  path.write_text(migrated, encoding='utf-8')
                  changed.append(str(path))
          if not changed:
              raise SystemExit('no source-local RTK guidance found in the reviewed allowlist')
          print('\n'.join(changed))
          PY
          git rm .github/workflows/apply-residual-rtk-source-sync.yml
          git diff --check
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add -u
          git commit -m 'docs: sync residual RTK guidance removal'
          git push origin HEAD:sync/remove-residual-rtk-guidance
